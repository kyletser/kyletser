<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Xiaoping Liao — Agent systems and developer tools</title>
  <desc id="desc">Dark terminal-inspired banner with a cyan and violet execution graph: input, state, tools, evidence.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090e1c"/><stop offset="1" stop-color="#17182f"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7986b0" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="20" fill="none" stroke="#30394f"/>
  <path d="M32 1H1168" stroke="url(#accent)" stroke-width="2"/>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <circle cx="43" cy="35" r="5" fill="#fb7185"/><circle cx="61" cy="35" r="5" fill="#fbbf24"/><circle cx="79" cy="35" r="5" fill="#5eead4"/>
    <text x="105" y="40" fill="#9caac5" font-size="13" font-family="Consolas,monospace">kyletser / workspace</text>
    <text x="48" y="111" fill="#5eead4" font-size="13" letter-spacing="3">AGENT SYSTEMS / DEVELOPER TOOLS</text>
    <text x="46" y="175" fill="#f1f5ff" font-size="55" font-weight="700" letter-spacing="-2">Xiaoping Liao</text>
    <text x="49" y="215" fill="#aab8d2" font-size="19">Building agents you can inspect, test, and recover.</text>
    <rect x="48" y="265" width="152" height="30" rx="15" fill="#142c32" stroke="#315e61"/>
    <text x="124" y="285" text-anchor="middle" fill="#80e8d6" font-size="12">LOCAL-FIRST</text>
    <rect x="212" y="265" width="152" height="30" rx="15" fill="#25213d" stroke="#534671"/>
    <text x="288" y="285" text-anchor="middle" fill="#c4b5fd" font-size="12">OPEN SOURCE</text>
    <g stroke="#52607e" fill="none" stroke-width="1.5">
      <path d="M802 122H865V178H917"/><path d="M802 234H865V178"/><path d="M1037 178H1100V278H865"/>
      <path d="M865 278H738V260" stroke-dasharray="4 6"/>
    </g>
    <g fill="#131f30" stroke="#3b6970"><rect x="688" y="96" width="114" height="52" rx="10"/><rect x="688" y="208" width="114" height="52" rx="10"/></g>
    <rect x="917" y="149" width="120" height="58" rx="10" fill="#28213d" stroke="#8b75b8"/>
    <g font-size="14" text-anchor="middle" font-family="Consolas,monospace"><text x="745" y="128" fill="#80e8d6">input</text><text x="745" y="240" fill="#80e8d6">state</text><text x="977" y="184" fill="#dacfff">tools</text></g>
    <circle cx="865" cy="178" r="5" fill="#5eead4"/>
    <text x="928" y="300" fill="#9caac5" font-size="12" font-family="Consolas,monospace">evidence / recovery</text>
  </g>
</svg>
